<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Browser Stream</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #0e1116; --line: #1f242c;
    --text: #e7eaee; --dim: #8892a0; --accent: #4f8cff; --err: #ff6b6b; --ok: #4ade80;
  }
  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 ui-sans-serif, system-ui, sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .header { padding: 10px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
  .row { display: flex; gap: 6px; align-items: center; }
  h1 { margin: 0; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); }
  input {
    flex: 1; background: #0b0d10; border: 1px solid #2a3038; color: var(--text);
    padding: 8px; border-radius: 4px; font: inherit; outline: none; min-width: 0;
  }
  input:focus { border-color: var(--accent); }
  button {
    background: #14181e; border: 1px solid #2a3038; color: var(--text);
    padding: 8px 12px; border-radius: 4px; font: inherit; cursor: pointer; white-space: nowrap;
  }
  button.primary { border-color: #22314d; color: var(--accent); }
  button.success { border-color: #1d4d28; color: var(--ok); font-weight: bold; }
  button.cookie { border-color: #4d3a1d; color: #ffb74d; font-weight: bold; }
  
  .screen-wrap { flex: 1; position: relative; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #screen { max-width: 100%; max-height: 100%; object-fit: contain; display: block; touch-action: none; }
  
  #log-overlay {
    position: absolute; top: 10px; left: 10px; right: 10px;
    background: rgba(0,0,0,0.8); border: 1px solid var(--line);
    padding: 10px; border-radius: 6px; font-family: monospace; font-size: 11px;
    color: var(--ok); pointer-events: none; opacity: 1; transition: opacity 0.5s;
  }
  #log-overlay.hidden { opacity: 0; }

  .footer { padding: 10px; background: var(--panel); border-top: 1px solid var(--line); display: flex; gap: 6px; flex-shrink: 0; }
  #status { color: var(--dim); font-size: 11px; margin-left: auto; }
</style>
</head>
<body>
  <div class="header">
    <div class="row">
      <h1>Browser</h1>
      <button id="btn-gen" class="success" style="margin-left:auto;">Generate</button>
      <button id="btn-cookie" class="cookie">Get Cookie</button>
      <span id="status">disconnected</span>
    </div>
    <div class="row">
      <input type="email" id="email" placeholder="FB Email" />
      <input type="password" id="pass" placeholder="Password" />
      <button id="btn-login" class="primary">Login</button>
    </div>
  </div>
  
  <div class="screen-wrap">
    <div id="log-overlay">Waiting for connection...</div>
    <img id="screen" />
  </div>

  <div class="footer">
    <input type="text" id="text-input" placeholder="Type 2FA code here, then press Enter..." />
  </div>

<script>
  const $ = s => document.querySelector(s);
  const statusEl = $("#status");
  const screen = $("#screen");
  const logOverlay = $("#log-overlay");
  
  const token = new URLSearchParams(location.search).get("t") || "";
  const wsUrl = `wss://${location.host}/ws?token=${encodeURIComponent(token)}`;
  let ws;
  let isReady = false;
  let downloadType = ""; // "appstate" or "cookie"

  function updateLog(msg, isError) {
    logOverlay.textContent = msg;
    logOverlay.style.color = isError ? "var(--err)" : "var(--ok)";
    logOverlay.classList.remove("hidden");
  }

  function connect() {
    updateLog("Connecting to WebSocket...");
    ws = new WebSocket(wsUrl);
    
    ws.onopen = () => { 
      statusEl.textContent = "connected"; 
      statusEl.style.color = "var(--ok)"; 
    };
    
    ws.onclose = () => { 
      statusEl.textContent = "disconnected"; 
      statusEl.style.color = "var(--err)"; 
      isReady = false;
      updateLog("WebSocket disconnected. Reconnecting in 2s...", true);
      setTimeout(connect, 2000); 
    };

    ws.onerror = () => {
      updateLog("WebSocket error. Check if token is correct.", true);
    };
    
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      
      if (msg.type === "log") {
        updateLog(msg.text);
      } else if (msg.type === "frame") {
        screen.src = "data:image/jpeg;base64," + msg.data;
        if (!isReady) { isReady = true; logOverlay.classList.add("hidden"); }
      } else if (msg.type === "appstate") {
        if (downloadType === "cookie") {
          alert("Success! Cookie string generated.");
          const blob = new Blob([msg.cookieString], { type: "text/plain" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "cookies.txt";
          a.click();
        } else {
          alert("Success! Appstate generated.");
          const blob = new Blob([msg.json], { type: "application/json" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "appstate.json";
          a.click();
        }
      } else if (msg.type === "error") {
        updateLog(msg.message, true);
      }
    };
  }
  connect();

  screen.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (!isReady) return;
    const rect = screen.getBoundingClientRect();
    const touch = e.touches[0];
    const x = (touch.clientX - rect.left) * (1280 / rect.width);
    const y = (touch.clientY - rect.top) * (900 / rect.height);
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "click", x, y }));
  });

  screen.addEventListener("click", (e) => {
    if (!isReady) return;
    const rect = screen.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (1280 / rect.width);
    const y = (e.clientY - rect.top) * (900 / rect.height);
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "click", x, y }));
  });

  $("#text-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const text = e.target.value;
      e.target.value = "";
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: "type", text }));
        ws.send(JSON.stringify({ type: "press", key: "Enter" }));
      }
    }
  });

  $("#btn-login").onclick = () => {
    const email = $("#email").value.trim();
    const password = $("#pass").value;
    if (!email || !password) return alert("Email and password required");
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: "login", email, password }));
      $("#pass").value = "";
    }
  };

  $("#btn-gen").onclick = () => {
    downloadType = "appstate";
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: "generate" }));
    }
  };

  $("#btn-cookie").onclick = () => {
    downloadType = "cookie";
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: "generate" }));
    }
  };
</script>
</body>
</html>
